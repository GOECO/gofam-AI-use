
<!DOCTYPE html>
<html lang="vi" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>GOFAM FARM AI</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=Noto+Sans:wght@300;400;500;600;700&family=Lexend:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet" />
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        primary: '#13ec49',
                        'primary-dark': '#0eb537',
                        'background-light': '#f8faf8',
                        'background-dark': '#080c09',
                        'card-dark': '#121a14',
                        'surface-dark': '#0f1610',
                        'border-dark': 'rgba(255, 255, 255, 0.08)',
                        'text-main': '#1a2c1e',
                        'text-secondary': '#64748b'
                    },
                    fontFamily: {
                        sans: ['Noto Sans', 'sans-serif'],
                        display: ['Space Grotesk', 'sans-serif'],
                        lexend: ['Lexend', 'sans-serif'],
                        mono: ['JetBrains Mono', 'monospace'],
                    },
                    boxShadow: {
                        'soft': '0 4px 25px -4px rgba(0, 0, 0, 0.04)',
                        'deep': '0 12px 40px -8px rgba(0, 0, 0, 0.08)',
                        'glow': '0 0 20px rgba(19, 236, 73, 0.35)',
                    },
                    borderRadius: {
                        '4xl': '2rem',
                        '5xl': '2.5rem',
                        '6xl': '3rem',
                    }
                }
            }
        }
    </script>
    <style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .icon-fill {
            font-variation-settings: 'FILL' 1, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        body {
            font-family: 'Noto Sans', sans-serif;
            background-color: #f8faf8;
            color: #1a2c1e;
            -webkit-font-smoothing: antialiased;
        }
        .dark body {
            background-color: #080c09;
            color: #f8faf8;
        }
        .hide-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .hide-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
        @keyframes scan {
            0% { top: 0%; opacity: 0; }
            10% { opacity: 1; }
            90% { opacity: 1; }
            100% { top: 100%; opacity: 0; }
        }
        .scanner-line {
            animation: scan 2s infinite linear;
        }
    </style>
<script type="importmap">

    "@google/genai": "https://esm.sh/@google/genai@^1.34.0"
  }
}
</script>
</head>
<body class="antialiased selection:bg-[#E6FFEC] selection:text-primary-dark transition-colors duration-300">
